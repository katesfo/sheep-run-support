<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sheep Run — playable preview</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #2e4d33; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  #note { position: fixed; bottom: 6px; width: 100%; text-align: center;
          font: 12px -apple-system, "Avenir Next", Avenir, sans-serif; color: rgba(255,255,255,.55); pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="note">Browser preview — same tuning constants as the Xcode build. Tap / click / Space to jump, hold for a big leap.</div>
<script>
"use strict";

/* ================= Config (mirrors GameScene.swift) ================= */
const W = 844, H = 390;
const CFG = {
  groundTop: 76,
  gravity: -2150,
  jumpVelocity: 780,
  jumpCutVelocity: 280,
  baseSpeed: 255,
  speedRamp: 7,
  maxSpeed: 620,
  coyoteTime: 0.09,
  jumpBufferTime: 0.12,
  pointsPerMeter: 48,
  lowFence: 42,
  tallFence: 63,
};
const GY = H - CFG.groundTop;          // canvas y of ground top
const SHEEP_GY = GY - 15;              // sheep centre when grounded
const PLAYER_X = W * 0.30;
const FARMER_X = PLAYER_X - 112;
const MUD = { slow: 0.55, startM: 100, comboM: 160, gapNormal: 112, gapCatch: 44, gapClose: 95, gapRecover: 55 };
const TALL_START_M = 60;
const TRACT = { ramp: 92, top: 74, h: 52, cowGap: 55 };
const MILL = { h: 140, hitW: 76 };
const CLOUDPAD = { centerH: 85, standOff: 25, halfSpan: 62, gap: 175, apexY: 90 }; // apexY: canvas y the launch peaks at
const BALE = { r: 24, extra: 150 };    // hay bales roll TOWARD you, this much faster than the world
const DUCK = { w: 96, h: 30 };         // mum + 3 ducklings: long and low

/* ================= Palette ================= */
const C = {
  sky:"#87CFF2", sun:"#FFD64D", sunRay:"#FFE073", sunFace:"#B87A26", cloud:"#FFFFFF",
  hillFar:"#B3DE8F", hillNear:"#99CF75",
  grass:"#6BB852", grassDark:"#549C42", dirt:"#916B45", dirtDark:"#7D5938",
  picket:"#FCFAF0", picketShade:"#D9D6C7",
  barnRed:"#CC4A3B", barnRoof:"#8F3329", barnTrim:"#FAF5E6",
  trunk:"#785433", leafGreen:"#4D9447", leafDark:"#3D803D",
  wool:"#FAF7ED", woolShade:"#E0DBCC", sheepFace:"#383333", earPink:"#F0A6A6",
  skin:"#F5CCA1", hatStraw:"#EDC759", hatBand:"#B35940",
  overalls:"#476BB8", shirt:"#D95447", boots:"#594026",
  shadow:"rgba(0,0,0,0.14)", hud:"rgba(26,56,26,0.60)", gold:"#FFED73",
};

/* ================= Canvas setup ================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const scale = Math.min(window.innerWidth / W, (window.innerHeight - 24) / H);
  canvas.style.width = (W * scale) + "px";
  canvas.style.height = (H * scale) + "px";
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", fit);
fit();

function rr(x, y, w, h, r, color) {  // rounded rect
  ctx.fillStyle = color;
  ctx.beginPath();
  const rad = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.fill();
}
function crc(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function ell(x, y, rx, ry, color, rot) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, rot || 0, 0, 7); ctx.fill();
}
function txt(s, x, y, size, color, bold, align) {
  ctx.fillStyle = color;
  ctx.font = (bold === false ? "500 " : "800 ") + size + "px -apple-system, 'Avenir Next', Avenir, sans-serif";
  ctx.textAlign = align || "center"; ctx.textBaseline = "middle";
  ctx.fillText(s, x, y);
}

/* ================= Sound (mirrors SoundKit.swift) ================= */
let audio = null, muted = false;
function ac() {
  if (!audio) { try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (audio && audio.state === "suspended") audio.resume();
  return audio;
}
function tone(segs) { // segs: [f0, f1, dur, vol, type, delay]
  const a = ac(); if (!a || muted) return;
  let t = a.currentTime + 0.01;
  for (const [f0, f1, dur, vol, type, gap] of segs) {
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.linearRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.008);
    g.gain.setValueAtTime(vol, t + Math.max(dur - 0.03, 0.009));
    g.gain.linearRampToValueAtTime(0, t + dur);
    osc.connect(g); g.connect(a.destination);
    osc.start(t); osc.stop(t + dur + 0.02);
    t += dur + (gap || 0);
  }
}
const SFX = {
  jump()      { tone([[320, 760, 0.08, 0.20], [900, 900, 0.05, 0.15]]); },
  boing()     { tone([[150, 520, 0.06, 0.10]]);
                const a = ac(); if (!a || muted) return;
                const osc = a.createOscillator(), g = a.createGain(),
                      lfo = a.createOscillator(), lg = a.createGain();
                osc.type = "sine";
                const t = a.currentTime + 0.08;
                osc.frequency.setValueAtTime(440, t);
                osc.frequency.linearRampToValueAtTime(170, t + 0.26);
                lfo.frequency.value = 10; lg.gain.value = 20;
                lfo.connect(lg); lg.connect(osc.frequency);
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(0.09, t + 0.02);
                g.gain.linearRampToValueAtTime(0, t + 0.26);
                osc.connect(g); g.connect(a.destination);
                osc.start(t); lfo.start(t); osc.stop(t + 0.30); lfo.stop(t + 0.30); },
  trip()      { tone([[240, 150, 0.10, 0.22, "triangle"], [120, 90, 0.08, 0.15, "triangle"]]); },
  squelch()   { tone([[180, 110, 0.14, 0.20, "triangle"], [95, 70, 0.10, 0.15, "triangle"]]); },
  moo()       { tone([[196, 150, 0.26, 0.16, "triangle"], [150, 122, 0.24, 0.13, "triangle"]]); },
  quack()     { tone([[830, 620, 0.09, 0.16, "triangle"], [760, 540, 0.11, 0.13, "triangle"]]); },
  baa()       { const a = ac(); if (!a || muted) return;
                const osc = a.createOscillator(), g = a.createGain(),
                      lfo = a.createOscillator(), lg = a.createGain();
                osc.type = "triangle";
                const t = a.currentTime + 0.01;
                osc.frequency.setValueAtTime(640, t);
                osc.frequency.linearRampToValueAtTime(460, t + 0.36);
                lfo.frequency.value = 9; lg.gain.value = 22;
                lfo.connect(lg); lg.connect(osc.frequency);
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(0.10, t + 0.02);
                g.gain.linearRampToValueAtTime(0, t + 0.36);
                osc.connect(g); g.connect(a.destination);
                osc.start(t); lfo.start(t); osc.stop(t + 0.4); lfo.stop(t + 0.4); },
  milestone() { tone([[523.25,523.25,0.09,0.16,"triangle"],[659.25,659.25,0.09,0.16,"triangle"],
                      [783.99,783.99,0.10,0.17,"triangle"],[1046.5,1046.5,0.14,0.17,"triangle"]]); },
  fail()      { tone([[400,300,0.25,0.18,"triangle"],[300,165,0.42,0.18,"triangle"]]); },
  start()     { tone([[880,1350,0.11,0.16],[1350,950,0.13,0.16]]); },
  grab()      { tone([[320,760,0.08,0.18]]); },
};

/* ================= Game state ================= */
let phase = "title";          // title | running | crashed
let last = 0, runT = 0, dist = 0, meters = 0, milestone = 0;
let vy = 0, grounded = true, coyote = 0, jumpBuf = 0, holding = false;
let sheepY = SHEEP_GY, sheepRot = 0;
let best = 0;
let fences = [], details = [], props = [], dusts = [], floats = [];
let muds = [], farmerGap = MUD.gapNormal, mudSplashT = 0, mudCaught = false;
let stumbleT = 0, flashT = 0;
let tractors = [], cows = [], windmills = [], pads = [], pendingExtra = 0;
let bales = [], ducks = [];
let fY = GY - 17, fVy = 0, fAir = false;   // Farmer Dave's own jump state
let cloudLaunch = false;                    // mid-boing: releasing must not cut the launch

function groundHAt(x) {
  let h = 0;
  for (const tr of tractors) {
    const rel = x - tr.x;
    if (rel >= 0 && rel <= TRACT.ramp) h = Math.max(h, TRACT.h * rel / TRACT.ramp);
    else if (rel > TRACT.ramp && rel <= TRACT.ramp + TRACT.top) h = Math.max(h, TRACT.h);
  }
  return h;
}
let sinceFence = 0, nextGap = 300, sinceDetail = 0, nextDetail = 30, sinceProp = 0, nextProp = 200;
let hillOff = 0, clouds = [], titleT = 0;
let crashT = -1, farmerCatchX = null, sheepCarried = false, canRestart = false, wasBest = false;
let toastT = -1, toastMain = "", toastSub = "";
let gateX = null;

function seedClouds() {
  clouds = [];
  for (let i = 0; i < 3; i++) clouds.push({
    x: Math.random() * W, y: 42 + Math.random() * 86,
    s: 0.8 + Math.random() * 0.5, v: 14 + Math.random() * 12,
  });
}
function seedDetails() {
  details = [];
  for (let x = 12; x < W; x += 30 + Math.random() * 60) spawnDetail(x);
}
function spawnDetail(x) {
  const roll = Math.random();
  details.push({
    x, y: GY + 5 + Math.random() * (CFG.groundTop * 0.46 - 12),
    type: roll < 0.4 ? "tuft" : roll < 0.8 ? "flower" : "pebble",
    c: [ "#FFFFFF", "#FCCB4C", "#F5A1B8" ][Math.floor(Math.random() * 3)],
  });
}
function computeGap(speed) {
  const upper = Math.max(0.95, 1.30 - Math.floor(meters / 100) * 0.04);
  return Math.max(215, speed * (0.74 + Math.random() * (upper - 0.74))) + 52;
}

function inMudAt(x) { return muds.some(m => Math.abs(m.x - x) < m.len / 2 - 6); }

function startTitle() {
  phase = "title"; titleT = 0;
  fences = []; muds = []; dusts = []; floats = []; props = [];
  seedClouds(); seedDetails();
  gateX = W * 0.60;
}
function startRun() {
  phase = "running";
  runT = 0; dist = 0; meters = 0; milestone = 0;
  vy = 0; grounded = true; coyote = 0; jumpBuf = 0; holding = false;
  sheepY = SHEEP_GY; sheepRot = 0;
  fences = []; muds = []; dusts = []; floats = []; props = [];
  tractors = []; cows = []; windmills = []; pads = []; pendingExtra = 0;
  bales = []; ducks = [];
  fY = GY - 17; fVy = 0; fAir = false; cloudLaunch = false;
  farmerGap = MUD.gapNormal; mudSplashT = 0; mudCaught = false;
  stumbleT = 0; flashT = 0;
  sinceFence = -(W * 0.55); nextGap = 300;
  sinceDetail = 0; nextDetail = 30; sinceProp = 0; nextProp = 200;
  seedClouds(); seedDetails();
  gateX = PLAYER_X + 70;
  crashT = -1; farmerCatchX = null; sheepCarried = false; canRestart = false; wasBest = false;
  toastT = 0; toastMain = "RUN!"; toastSub = "The gate's open — go go go!";
  SFX.start();
}
function doJump() {
  vy = CFG.jumpVelocity;
  grounded = false; coyote = 0; jumpBuf = 0; cloudLaunch = false;
  SFX.boing();
  puff(PLAYER_X - 4, GY - 2, 5);
}
function puff(x, y, n, color) {
  for (let i = 0; i < n; i++) dusts.push({
    x: x + (Math.random() - 0.5) * 10, y: y + (Math.random() - 0.5) * 6,
    vx: (Math.random() - 0.5) * 90, vy: -(20 + Math.random() * 70),
    r: 2 + Math.random() * 2.5, t: 0.5 + Math.random() * 0.3,
    c: color || "#DED2B3",
  });
}
function crash() {
  phase = "crashed"; crashT = 0; holding = false; mudCaught = false;
  fY = GY - 17; fVy = 0; fAir = false; cloudLaunch = false;
  punIdx = Math.floor(Math.random() * puns.length);
  SFX.fail();
  wasBest = meters > best;
  if (wasBest) best = meters;
  puff(PLAYER_X, sheepY, 14);
}
function caughtByDave() {
  phase = "crashed"; crashT = 0; holding = false; mudCaught = true;
  fY = GY - 17; fVy = 0; fAir = false; cloudLaunch = false;
  punIdx = Math.floor(Math.random() * puns.length);
  SFX.fail();
  wasBest = meters > best;
  if (wasBest) best = meters;
  puff(PLAYER_X, GY - 4, 10, "#735433");
  farmerCatchX = PLAYER_X - farmerGap;   // Dave is already right there
}

/* Nearest solid obstacle rolling toward Dave; if it is about to reach him,
   return the launch velocity that clears it. */
function nextHurdle(x, speed) {
  let bestDx = 1e9, bestTop = 0, bestClosing = speed;
  const consider = (ox, top, closing) => {
    const d = ox - x;
    if (d > 6 && d < bestDx) { bestDx = d; bestTop = top; bestClosing = closing; }
  };
  for (const f of fences) if (!f.hit) consider(f.x, f.h, speed);
  for (const b of bales) consider(b.x, BALE.r * 2, speed + BALE.extra);
  for (const d of ducks) consider(d.x, DUCK.h + 6, speed + 14);
  for (const c of cows) consider(c.x, 74, speed);
  for (const wm of windmills) consider(wm.x, MILL.h, speed);
  if (bestDx > 1e8 || bestClosing <= 0) return 0;
  const launch = Math.min(900, Math.sqrt(2 * 2150 * (bestTop + 28)));
  return bestDx <= bestClosing * (launch / 2150) ? launch : 0;
}

/* ================= Input ================= */
function press(x, y) {
  ac();
  // mute button (all phases)
  if (x > W - 66 && y < 62) { muted = !muted; return; }
  if (phase === "title") { startRun(); return; }
  if (phase === "running") {
    holding = true; jumpBuf = CFG.jumpBufferTime;
    if (grounded || coyote > 0) doJump();
    return;
  }
  if (phase === "crashed" && canRestart) {
    if (y > H / 2 + 53 && y < H / 2 + 99) {
      if (x > W / 2 - 180 && x < W / 2 - 8) { startRun(); return; }
      if (x > W / 2 + 2 && x < W / 2 + 134) { startTitle(); return; }
    }
  }
}
function release() {
  holding = false;
  if (phase === "running" && vy > CFG.jumpCutVelocity && !cloudLaunch) vy = CFG.jumpCutVelocity;
}
canvas.addEventListener("pointerdown", e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  press((e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H);
});
window.addEventListener("pointerup", release);
window.addEventListener("keydown", e => {
  if (e.repeat) return;
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    if (phase === "crashed" && canRestart) { startRun(); return; }  // Space = New Game
    press(W / 2, H / 2);
  }
});
window.addEventListener("keyup", e => {
  if (e.code === "Space" || e.code === "ArrowUp") release();
});

/* ================= Update ================= */
function update(dt) {
  clouds.forEach(c => { c.x -= c.v * dt; if (c.x < -100) c.x = W + 100; });

  if (phase === "title") { titleT += dt; return; }

  if (phase === "crashed") {
    crashT += dt;
    dusts.forEach(d => { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 160 * dt; d.t -= dt; });
    dusts = dusts.filter(d => d.t > 0);
    // farmer jogs in and scoops up the sheep
    if (crashT > 0.45 && farmerCatchX === null) farmerCatchX = PLAYER_X - farmerGap;
    if (farmerCatchX !== null && !sheepCarried) {
      farmerCatchX = Math.min(farmerCatchX + 260 * dt, PLAYER_X - 40);
      if (farmerCatchX >= PLAYER_X - 40.5 && crashT > 1.0) { sheepCarried = true; SFX.grab(); SFX.baa(); }
    }
    if (crashT > 1.5) canRestart = true;
    return;
  }

  // ---- running ----
  runT += dt;
  const bogged = grounded && groundHAt(PLAYER_X) === 0 && inMudAt(PLAYER_X);
  const stg = Math.floor(meters / 100);   // every 100 m is a new stage
  let speed = Math.min(CFG.baseSpeed + CFG.speedRamp * runT + stg * 8, CFG.maxSpeed);
  if (bogged) speed *= MUD.slow;
  else if (stumbleT > 0) speed *= 0.6;
  stumbleT = Math.max(0, stumbleT - dt);
  flashT = Math.max(0, flashT - dt);

  dist += speed * dt;
  const m = Math.floor(dist / CFG.pointsPerMeter);
  if (m !== meters) {
    meters = m;
    if (Math.floor(m / 100) > milestone) {
      milestone = Math.floor(m / 100);
      SFX.milestone();
      floats.push({ s: (milestone * 100) + " m", x: W / 2, y: H * 0.40, t: 1.0 });
    }
  }

  // sheep physics over terrain (ground or tractor tops).
  // Springy clouds BOING you on ANY touch - jumped into or run through,
  // either way you're going over that windmill. One boing per cloud.
  const terrainH = groundHAt(PLAYER_X);
  const floorY = SHEEP_GY - terrainH;
  const padBounceY = GY - CLOUDPAD.centerH - CLOUDPAD.standOff;
  vy += CFG.gravity * dt;
  let ny = sheepY - vy * dt;
  let bounced = false;
  for (const p of pads) {
    if (p.used) continue;
    // Tall, soft catch zone in BOTH directions.
    const reach = p.x - PLAYER_X;
    if (reach < 24 && reach > -CLOUDPAD.halfSpan &&   // fire near the cloud's middle, not its front edge
        sheepY >= padBounceY - 64 &&
        sheepY <= padBounceY + 104) {   // reaches all the way down to a sheep on the ground
      p.used = true;
      if (sheepY <= padBounceY + 52) ny = Math.min(ny, padBounceY);  // aerial catch: stand on the cloud
      // Launch with just enough power to peak below the top of the screen
      vy = Math.min(950, Math.sqrt(2 * Math.abs(CFG.gravity) * Math.max(45, ny - CLOUDPAD.apexY)));
      bounced = true;
      grounded = false;
      cloudLaunch = true;
      // The boing is a promise: this cloud's windmill can't THUNK you any more
      for (const wm of windmills) {
        const millDX = wm.x - p.x;
        if (millDX > 0 && millDX < CLOUDPAD.gap + 90 && !wm.hit) { wm.hit = true; break; }
      }
      p.sq = 0.35;
      SFX.boing();
      puff(PLAYER_X, ny + 14, 8, "#FFFFFF");
      floats.push({ s: "BOING!", x: PLAYER_X + 26, y: ny - 30, t: 0.7 });
      break;
    }
  }
  if (!bounced) {
    if (grounded) {
      if (floorY <= ny + 8) { ny = floorY; vy = 0; }   // follow terrain
      else { grounded = false; vy = 0; }               // the ground fell away
    } else if (vy <= 0 && ny >= floorY) {
      ny = floorY; grounded = true; vy = 0; cloudLaunch = false;
      if (terrainH === 0 && inMudAt(PLAYER_X)) { SFX.squelch(); puff(PLAYER_X - 4, GY - 3, 8, "#735433"); }
      else puff(PLAYER_X - 6, ny + 14, 6);
    }
  }
  sheepY = ny;
  sheepRot = grounded ? 0 : Math.max(-0.22, Math.min(0.30, vy / 3200));

  coyote = grounded ? CFG.coyoteTime : Math.max(0, coyote - dt);
  if (jumpBuf > 0) {
    jumpBuf -= dt;
    if (grounded || coyote > 0) doJump();
  }

  // Mud: splashes while slogging + Farmer Dave closing in
  if (bogged) {
    mudSplashT -= dt;
    if (mudSplashT <= 0) { puff(PLAYER_X - 6, GY - 2, 3, "#735433"); mudSplashT = 0.16; }
    farmerGap = Math.max(farmerGap - Math.min(130, MUD.gapClose + stg * 6) * dt, MUD.gapCatch - 8);
  } else if (stumbleT <= 0) {
    farmerGap = Math.min(farmerGap + MUD.gapRecover * dt, MUD.gapNormal);
  }
  if (farmerGap <= MUD.gapCatch) { caughtByDave(); return; }

  // Dave hurdles the obstacles too - cosmetic only; the chase itself is
  // still decided entirely by farmerGap.
  const fX = PLAYER_X - farmerGap;
  const fFloor = GY - 17 - groundHAt(fX);
  if (fAir) {
    fVy -= 2150 * dt;
    fY -= fVy * dt;
    if (fVy <= 0 && fY >= fFloor) { fY = fFloor; fAir = false; fVy = 0; puff(fX - 4, GY - 4, 4); }
  } else if (fY > fFloor + 1) {
    fY = fFloor;                                   // walking up a ramp
  } else if (fY < fFloor - 1) {
    fAir = true; fVy = 0;                          // the ramp ended
  } else {
    const launch = nextHurdle(fX, speed);
    if (launch) { fVy = launch; fAir = true; }
  }

  // fences + mud scroll & spawn
  fences.forEach(f => f.x -= speed * dt);
  fences = fences.filter(f => f.x > -80);
  muds.forEach(m => m.x -= speed * dt);
  muds = muds.filter(m => m.x > -240);
  tractors.forEach(tr => tr.x -= speed * dt);
  tractors = tractors.filter(tr => tr.x > -420);
  cows.forEach(c => {
    c.x -= speed * dt;
    if (!c.mooed && c.x < W - 30) { c.mooed = true; SFX.moo(); }
  });
  cows = cows.filter(c => c.x > -240);
  windmills.forEach(wm => wm.x -= speed * dt);
  windmills = windmills.filter(wm => wm.x > -240);
  pads.forEach(p => { p.x -= speed * dt; p.sq = Math.max(0, p.sq - dt * 1.6); });
  pads = pads.filter(p => p.x > -160);
  // Hay bales roll toward you, faster than the world
  const baleSpeed = speed + BALE.extra;
  bales.forEach(b => { b.x -= baleSpeed * dt; b.rot -= (baleSpeed / BALE.r) * dt; });
  bales = bales.filter(b => b.x > -120);
  // The duck family waddles along (with commentary on arrival)
  ducks.forEach(d => {
    d.x -= (speed + 14) * dt;
    if (!d.quacked && d.x < W - 30) { d.quacked = true; SFX.quack(); }
    d.hop = Math.max(0, d.hop - dt);
  });
  ducks = ducks.filter(d => d.x > -200);
  sinceFence += speed * dt;
  if (sinceFence >= nextGap) {
    if (stg >= 4 && Math.random() < Math.min(0.22, 0.10 + (stg - 4) * 0.05)) {
      pads.push({ x: W + 70, sq: 0, used: false });          // the cloud comes first
      windmills.push({ x: W + 70 + CLOUDPAD.gap, hit: false });
      pendingExtra = 260;
    } else if (stg >= 3 && Math.random() < Math.min(0.30, 0.12 + (stg - 3) * 0.06)) {
      // Tractor ramp + cow set piece: run up, launch, clear the cow
      const sx0 = W + 90;
      tractors.push({ x: sx0 });
      cows.push({ x: sx0 + TRACT.ramp + TRACT.top + TRACT.cowGap + 46, hit: false, mooed: false });
      pendingExtra = 330;
    } else {
      const mudChance = stg >= 1 ? Math.min(0.40, 0.10 + (stg - 1) * 0.08) : 0;
      if (Math.random() < mudChance) {
        muds.push({ x: W + 90, len: 92 + Math.min(stg * 18, 150) });
      } else if (stg >= 2 && Math.random() < 0.16) {
        // From stage 2: hay bales come rolling at you
        bales.push({ x: W + 70, rot: 0, hit: false });
        pendingExtra = 90;   // they close distance fast; breathing room after
      } else if (stg >= 1 && Math.random() < 0.16) {
        // From stage 1: the duck family crossing
        ducks.push({ x: W + 80, hit: false, quacked: false, hop: 0 });
      } else {
        const tallChance = Math.min(0.6, stg * 0.15);
        fences.push({ x: W + 60, h: Math.random() < tallChance ? CFG.tallFence : CFG.lowFence });
        if (stg >= 2 && Math.random() < Math.min(0.35, (stg - 1) * 0.08)) muds.push({ x: W + 60 + 118, len: 104 });
      }
    }
    sinceFence = 0; nextGap = computeGap(speed) + pendingExtra; pendingExtra = 0;
  }

  // collision (same forgiving boxes as Swift)
  const sx = PLAYER_X - 12, sy = sheepY - 12, sw = 24, sh = 26; // canvas box (y-down)
  for (const f of fences) {
    if (f.hit) continue;
    const fx = f.x - 52 * 0.32, fw = 52 * 0.64, fh = f.h - 6;
    const fyTop = GY - fh;
    if (sx < fx + fw && sx + sw > fx && sy < GY && sy + sh > fyTop) {
      // Stumble, not death: knock the fence, lose ground to Dave
      f.hit = true;
      stumbleT = 0.8; flashT = 0.6;
      farmerGap = Math.max(farmerGap - 55, MUD.gapCatch - 8);
      SFX.trip();
      puff(PLAYER_X, sheepY, 12);
      floats.push({ s: "Oof!", x: PLAYER_X, y: sheepY - 40, t: 0.7 });
      if (farmerGap <= MUD.gapCatch) { caughtByDave(); return; }
      break;
    }
  }

  // Cows: also a stumble (with commentary from the cow)
  for (const c of cows) {
    if (c.hit) continue;
    const cx0 = c.x - 92 * 0.40, cw = 92 * 0.80, ch = 74 - 6;
    const cyTop = GY - ch;
    if (sx < cx0 + cw && sx + sw > cx0 && sy < GY && sy + sh > cyTop) {
      c.hit = true;
      stumbleT = 0.8; flashT = 0.6;
      farmerGap = Math.max(farmerGap - 55, MUD.gapCatch - 8);
      SFX.moo(); SFX.trip();
      puff(PLAYER_X, sheepY, 12);
      floats.push({ s: "MOO!", x: PLAYER_X + 40, y: sheepY - 46, t: 0.8 });
      if (farmerGap <= MUD.gapCatch) { caughtByDave(); return; }
      break;
    }
  }

  // Rolling bales: clip one = stumble (it rolls on, unbothered)
  for (const b of bales) {
    if (b.hit) continue;
    const bx0 = b.x - BALE.r * 0.7, bw = BALE.r * 1.4, bh = BALE.r * 2 - 8;
    const byTop = GY - bh;
    if (sx < bx0 + bw && sx + sw > bx0 && sy < GY && sy + sh > byTop) {
      b.hit = true;
      stumbleT = 0.8; flashT = 0.6;
      farmerGap = Math.max(farmerGap - 55, MUD.gapCatch - 8);
      SFX.trip();
      puff(PLAYER_X, sheepY, 12);
      floats.push({ s: "OOF!", x: PLAYER_X + 26, y: sheepY - 44, t: 0.7 });
      if (farmerGap <= MUD.gapCatch) { caughtByDave(); return; }
      break;
    }
  }

  // The duck family: clip them = stumble + a piece of their mind
  for (const d of ducks) {
    if (d.hit) continue;
    const dx0 = d.x - DUCK.w / 2, dw = DUCK.w, dh = DUCK.h;
    const dyTop = GY - dh;
    if (sx < dx0 + dw && sx + sw > dx0 && sy < GY && sy + sh > dyTop) {
      d.hit = true; d.hop = 0.2;
      stumbleT = 0.8; flashT = 0.6;
      farmerGap = Math.max(farmerGap - 55, MUD.gapCatch - 8);
      SFX.quack(); SFX.trip();
      puff(PLAYER_X, sheepY, 10);
      floats.push({ s: "QUACK!!", x: PLAYER_X + 34, y: sheepY - 46, t: 0.8 });
      if (farmerGap <= MUD.gapCatch) { caughtByDave(); return; }
      break;
    }
  }

  // Windmills: clip the tower = stumble
  for (const wm of windmills) {
    if (wm.hit) continue;
    const wx0 = wm.x - MILL.hitW / 2, ww = MILL.hitW, wh = MILL.h - 6;
    const wyTop = GY - wh;
    if (sx < wx0 + ww && sx + sw > wx0 && sy < GY && sy + sh > wyTop) {
      wm.hit = true;
      stumbleT = 0.8; flashT = 0.6;
      farmerGap = Math.max(farmerGap - 55, MUD.gapCatch - 8);
      SFX.trip();
      puff(PLAYER_X, sheepY, 12);
      floats.push({ s: "THUNK!", x: PLAYER_X + 30, y: sheepY - 46, t: 0.8 });
      if (farmerGap <= MUD.gapCatch) { caughtByDave(); return; }
      break;
    }
  }

  // scenery
  if (gateX !== null) { gateX -= speed * dt; if (gateX < -160) gateX = null; }
  details.forEach(d => d.x -= speed * dt);
  details = details.filter(d => d.x > -40);
  sinceDetail += speed * dt;
  if (sinceDetail >= nextDetail) { spawnDetail(W + 30); sinceDetail = 0; nextDetail = 28 + Math.random() * 62; }

  const ps = speed * 0.35;
  props.forEach(p => p.x -= ps * dt);
  props = props.filter(p => p.x > -180);
  sinceProp += ps * dt;
  if (sinceProp >= nextProp) {
    props.push({ x: W + 150, type: Math.random() < 0.5 ? "barn" : "tree", s: 0.85 + Math.random() * 0.2 });
    sinceProp = 0; nextProp = 260 + Math.random() * 380;
  }

  hillOff = (hillOff + speed * 0.15 * dt) % W;

  dusts.forEach(d => { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 160 * dt; d.t -= dt; });
  dusts = dusts.filter(d => d.t > 0);
  floats.forEach(f => { f.y -= 38 * dt; f.t -= dt; });
  floats = floats.filter(f => f.t > 0);
  if (toastT >= 0) { toastT += dt; if (toastT > 1.6) toastT = -1; }
}

function drawWoolTitle(cx, cy) {
  // Kate's own SHEEP sticker artwork, with RUN! stamped over the corner
  if (LOGO.complete && LOGO.naturalWidth) {
    ctx.drawImage(LOGO, cx - 170, cy - 14 - 64.5, 340, 129);
  }
  ctx.save();
  ctx.translate(cx + 105, cy + 38); ctx.rotate(0.06);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = "900 34px -apple-system, 'Avenir Next', Avenir, sans-serif";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 15;
  ctx.strokeText("RUN!", 0, 0);
  ctx.strokeStyle = "#383333"; ctx.lineWidth = 8;
  ctx.strokeText("RUN!", 0, 0);
  ctx.fillStyle = "#D9543F"; ctx.fillText("RUN!", 0, 0);
  ctx.restore();
}
function pill(cx, cy, w, h, label, size) {
  rr(cx - w / 2, cy - h / 2, w, h, h / 2, C.hud);
  txt(label, cx, cy + 1, size, "#FFFFFF", true);
}
function drawMute() {
  crc(W - 44, 40, 20, C.hud);
  txt("♪", W - 44, 41, 18, muted ? "rgba(255,255,255,0.35)" : "#FFF");
}

function render() {
  const t = performance.now() / 1000;
  // sky
  ctx.fillStyle = C.sky; ctx.fillRect(0, 0, W, H);
  drawSun(88, 74, t);
  clouds.forEach(drawCloud);
  beginZoom();   // everything track-level is drawn 20% bigger around the sheep
  drawHills();
  // mid props
  if (phase === "title") {
    drawBarn(W * 0.86, GY + 12, 1); drawTree(W * 0.10, GY + 10, 1);
  } else props.forEach(p => (p.type === "barn" ? drawBarn : drawTree)(p.x, GY + 11, p.s));
  // ground
  ctx.fillStyle = C.dirt; ctx.fillRect(0, GY + CFG.groundTop * 0.46 - 4, W, H - GY);
  ctx.fillStyle = C.grass; ctx.fillRect(0, GY, W, CFG.groundTop * 0.46);
  ctx.fillStyle = C.grassDark; ctx.fillRect(0, GY, W, 4);
  for (let i = 0; i < 9; i++) ell((i * 97 + 40) % W, H - 8 - (i * 31) % 24, 5, 2, C.dirtDark);
  details.forEach(drawDetail);
  if (gateX !== null) drawGate(gateX);

  if (phase === "title") {
    // tableau: sheep mid-escape, farmer dozing
    drawSheep(W * 0.45, SHEEP_GY + Math.sin(t * 4.5) * 3, { running: false });
    drawFarmer(W * 0.78, GY - 17, { walking: false });
    const zA = (t % 1.4) / 1.4;
    txt("z z z", W * 0.78 + 16 + zA * 6, GY - 75 - zA * 12, 15, "rgba(255,255,255," + (0.9 - zA * 0.8) + ")", false);
    ctx.restore(); // end zoom - titles and buttons stay unscaled
    // titles
    drawWoolTitle(W / 2, H * 0.24);
    txt("Farmer Dave left the gate open…", W / 2, H * 0.24 + 78, 18, "#FFFFFF", false);
    const pulse = 0.55 + 0.45 * Math.sin(t * 5);
    const tapY = Math.min(H * 0.66, H - 192);   // clear sky, above the tableau
    txt("TAP TO RUN", W / 2, tapY, 25, "rgba(255,255,255," + pulse + ")");
    if (best > 0) txt("Best escape: " + best + " m", W / 2, tapY + 30, 16, "#FFFFFF", false);
    txt("Tap / Space to jump  •  Hold for a big leap  •  Don't hit the fences!", W / 2, H - 16, 13, "rgba(255,255,255,0.9)", false);
    drawMute();
    return;
  }

  // mud, fences, then the big stuff
  muds.forEach(drawMud);
  fences.forEach(f => drawFence(f.x, f.h, f.hit));
  ducks.forEach(drawDucks);
  cows.forEach(c => drawCow(c.x));
  tractors.forEach(tr => drawTractor(tr.x));
  windmills.forEach(wm => drawWindmill(wm.x, t));
  pads.forEach(drawPad);
  bales.forEach(drawBale);

  // characters
  if (phase === "crashed") {
    const fx = farmerCatchX === null ? FARMER_X : farmerCatchX;
    drawFarmer(fx, GY - 17, { walking: !sheepCarried && farmerCatchX !== null });
    if (sheepCarried) drawSheep(fx, GY - 17 - 58, { carried: true });
    else {
      const tumble = mudCaught ? 0 : Math.min(crashT / 0.32, 1);
      ctx.save(); ctx.translate(PLAYER_X - 22 * tumble, sheepY);
      ctx.rotate(1.3 * tumble);
      drawSheep(0, 0, { running: false }); ctx.restore();
    }
  } else {
    drawFarmer(PLAYER_X - farmerGap + Math.sin(runT * 2.1) * 6, fY, { walking: !fAir });
    if (flashT > 0 && Math.floor(flashT * 14) % 2 === 0) ctx.globalAlpha = 0.5;
    drawSheep(PLAYER_X, sheepY, { running: grounded, air: !grounded, rot: sheepRot });
    ctx.globalAlpha = 1;
  }

  // dust
  dusts.forEach(d => { ctx.globalAlpha = Math.max(d.t, 0) * 1.6; crc(d.x, d.y, d.r, d.c); ctx.globalAlpha = 1; });

  ctx.restore(); // end zoom - HUD and panels stay unscaled

  // HUD
  pill(W / 2, 29, 116, 36, meters + " m", 21);
  pill(W - 90 - 45, 29, 132, 32, "Best " + best + " m", 14);
  crc(34, 29, 20, C.hud); // decorative pause in preview
  rr(29.5, 21.5, 4.5, 15, 2, "rgba(255,255,255,0.4)");
  rr(38, 21.5, 4.5, 15, 2, "rgba(255,255,255,0.4)");
  drawMute();

  floats.forEach(f => {
    ctx.globalAlpha = Math.min(f.t / 0.45, 1);
    txt(f.s, f.x, f.y, 22, C.gold); ctx.globalAlpha = 1;
  });

  if (toastT >= 0) {
    const a = toastT < 0.2 ? toastT / 0.2 : toastT > 1.25 ? Math.max(0, (1.6 - toastT) / 0.35) : 1;
    ctx.globalAlpha = a;
    txt(toastMain, W / 2, H * 0.40, 38, "#FFFFFF");
    txt(toastSub, W / 2, H * 0.40 + 34, 18, "#FFFFFF", false);
    ctx.globalAlpha = 1;
  }

  if (phase === "crashed" && canRestart) {
    ctx.fillStyle = "rgba(0,0,0,0.42)"; ctx.fillRect(0, 0, W, H);
    // A cream storybook card with a timber border - and no emojis
    rr(W / 2 - 198, H / 2 - 124, 396, 248, 20, "#FCF7E8");
    ctx.strokeStyle = "#B78A59"; ctx.lineWidth = 3; ctx.stroke();
    rr(W / 2 - 189, H / 2 - 115, 378, 230, 15, "rgba(0,0,0,0)");
    ctx.strokeStyle = "rgba(183,138,89,0.35)"; ctx.lineWidth = 1.5; ctx.stroke();
    txt("Dave caught you", W / 2, H / 2 - 76, 27, "#C74D3D");
    txt(puns[punIdx], W / 2, H / 2 - 50, 15, "#5C4A36", false);
    txt(meters + " m", W / 2, H / 2 - 6, 42, "#4A7040");
    if (wasBest) txt("N E W   B E S T", W / 2, H / 2 + 26, 13, "#B8851F");
    else txt("Best " + best + " m", W / 2, H / 2 + 26, 14, "#5C4A36", false);
    // New Game button
    rr(W / 2 - 180, H / 2 + 53, 172, 46, 23, "#C74D3D");
    txt("New Game", W / 2 - 94, H / 2 + 76, 18, "#FCF7E8");
    // Menu button
    rr(W / 2 + 2, H / 2 + 53, 132, 46, 23, "#F2E8D0");
    ctx.strokeStyle = "#B78A59"; ctx.lineWidth = 2; ctx.stroke();
    txt("Menu", W / 2 + 68, H / 2 + 76, 17, "#5C4A36");
  }
}
const puns = ["Baa-d luck.", "Shear disappointment.", "So close to freedom.", "The flock will hear of this.", "Bogged at the worst moment.", "He's surprisingly quick for Dave."];
let punIdx = 0;

/* ================= Main loop ================= */
function loop(now) {
  const dt = Math.min(last === 0 ? 1 / 60 : (now - last) / 1000, 1 / 30);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}
startTitle();
requestAnimationFrame(loop);
</script>
